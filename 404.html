<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الصفحة غير موجودة — IOS Master</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style>
  :root{
    --bg:#0a0a09; --card:#131312; --fg:#f4f4f0; --muted:#8a8a83;
    --primary:#10b981; --line:rgba(255,255,255,.09);
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#fcfcf8; --card:#fff; --fg:#111110; --muted:#6b6b64; --primary:#007a52; --line:rgba(0,0,0,.10); }
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
    background:var(--bg); color:var(--fg);
    font-family:"Cairo",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  }
  .box{max-width:460px; text-align:center}
  .mark{
    width:64px;height:64px;margin:0 auto 22px;border-radius:18px;display:grid;place-items:center;
    background:rgba(16,185,129,.10); border:1px solid rgba(16,185,129,.35); color:var(--primary);
  }
  .mark svg{width:32px;height:32px}
  .code{font-family:ui-monospace,"JetBrains Mono",monospace; font-size:52px; font-weight:800; color:var(--primary); line-height:1}
  h1{font-size:20px; margin:14px 0 8px}
  p{color:var(--muted); font-size:14px; line-height:1.9; margin:0 0 24px}
  a.btn{
    display:inline-flex; align-items:center; gap:8px; padding:10px 20px; border-radius:10px;
    background:var(--primary); color:#04120c; font-weight:800; font-size:14px; text-decoration:none;
  }
  .links{margin-top:18px; font-size:12.5px; color:var(--muted)}
  .links a{color:var(--muted); margin:0 8px}
  .links a:hover{color:var(--primary)}
</style>
</head>
<body>
  <div class="box">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="14" width="20" height="7" rx="2"/>
        <path d="M6 14V9a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v5"/>
        <circle cx="17.5" cy="17.5" r="1"/><circle cx="6.5" cy="17.5" r="1"/>
      </svg>
    </div>
    <div class="code">404</div>
    <h1>هذا المسار غير موجود</h1>
    <p>الرابط الذي فتحته قد يكون قديماً أو مكتوباً خطأً. كل محتوى الموقع موجود في صفحة واحدة تبدأ من الرئيسية.</p>
    <a class="btn" id="home" href="/">العودة إلى IOS Master</a>
    <div class="links">
      <a href="#" id="cmds">مرجع الأوامر</a> ·
      <a href="#" id="qs">بنك الأسئلة</a>
    </div>
  </div>
<script>
  // GitHub Pages serves 404.html at the requested URL, so relative links break on
  // deep paths. Derive the site root from the first path segment on *.github.io.
  (function () {
    var seg = location.pathname.split("/").filter(Boolean);
    var base = (/(^|\.)github\.io$/.test(location.hostname) && seg.length) ? "/" + seg[0] + "/" : "/";
    document.getElementById("home").href = base;
    document.getElementById("cmds").href = base + "index.html#commands";
    document.getElementById("qs").href = base + "index.html#questions";
  })();
</script>
</body>
</html>
